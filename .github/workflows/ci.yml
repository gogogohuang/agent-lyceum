name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: npm ci # prepare 會一併 build
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web build
      - run: npm run check:docs
      - run: npm run lint
      - run: npm run typecheck # includes the mod's pure logic
      - run: npm test # includes the mod's pure-logic tests
      - run: npm run check:pack # `npm ci` already ran `prepare`, which builds
