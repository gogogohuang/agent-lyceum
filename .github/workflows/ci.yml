name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci # prepare 會一併 build
      - run: npm run typecheck # includes the mod's pure logic
      - run: npm test # includes the mod's pure-logic tests
      - run: npm run check:pack # `npm ci` already ran `prepare`, which builds
